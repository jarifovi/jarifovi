name: Daily Contribution Heartbeat

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Streak Heartbeat
        run: |
          echo "Daily Heartbeat: $(date)" > streak.txt

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add streak.txt
          git commit -m "Auto Streak Heartbeat Update: $(date)" || exit 0
          git push
